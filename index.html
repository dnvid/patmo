<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sua Jornada Patmo | Pré-Avaliação Personalizada</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A96E;
    --gold-light: #E8D5B0;
    --gold-dark: #9A7A4A;
    --cream: #FAF7F2;
    --cream-dark: #F2EDE4;
    --charcoal: #2C2C2C;
    --warm-gray: #8A8278;
    --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  .quiz-header {
    background: var(--white);
    border-bottom: 1px solid var(--gold-light);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .quiz-header-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 600;
    color: var(--charcoal); text-decoration: none;
  }
  .quiz-header-logo span { color: var(--gold); }
  .quiz-back {
    font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--warm-gray);
    text-decoration: none; cursor: pointer;
    transition: color 0.2s;
  }
  .quiz-back:hover { color: var(--gold-dark); }

  /* ── PROGRESS ── */
  .progress-bar-wrap {
    background: var(--cream-dark);
    padding: 0 40px;
    height: 4px;
    position: relative;
  }
  .progress-bar {
    height: 4px;
    background: var(--gold);
    transition: width 0.5s ease;
    width: 0%;
  }
  .progress-label {
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--warm-gray);
    padding: 10px 0 0;
  }

  /* ── MAIN CONTAINER ── */
  .quiz-main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* ── CHAT INTERFACE ── */
  .chat-container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── MESSAGES ── */
  .messages {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
    min-height: 200px;
  }

  .msg {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .msg.show { opacity: 1; transform: translateY(0); }

  /* Dra. Patricia message */
  .msg-dra { align-self: flex-start; }
  .msg-dra .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; color: var(--white); font-weight: 600;
    flex-shrink: 0;
  }
  .msg-dra .bubble {
    background: var(--white);
    border: 1px solid var(--gold-light);
    border-bottom-left-radius: 0;
    border-radius: 16px;
    padding: 16px 20px;
    max-width: 480px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .msg-dra .bubble-name {
    font-size: 10px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 6px; font-weight: 500;
  }
  .msg-dra .bubble-text {
    font-size: 15px; line-height: 1.7;
    color: var(--charcoal); font-weight: 300;
  }

  /* User message */
  .msg-user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-user .bubble {
    background: var(--gold);
    border-radius: 16px;
    border-bottom-right-radius: 0;
    padding: 12px 18px;
    max-width: 360px;
  }
  .msg-user .bubble-text {
    font-size: 14px; color: var(--white);
    font-weight: 400; line-height: 1.5;
  }
  .msg-user .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--cream-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }

  /* Typing indicator */
  .typing {
    display: flex; gap: 14px; align-items: flex-end;
    opacity: 0; transition: opacity 0.3s;
  }
  .typing.show { opacity: 1; }
  .typing .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; color: var(--white); font-weight: 600;
    flex-shrink: 0;
  }
  .typing-dots {
    background: var(--white);
    border: 1px solid var(--gold-light);
    border-radius: 16px; border-bottom-left-radius: 0;
    padding: 14px 20px;
    display: flex; gap: 6px; align-items: center;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold-light);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); background: var(--gold); }
  }

  /* ── INPUT AREA ── */
  .input-area {
    background: var(--white);
    border: 1px solid var(--gold-light);
    border-radius: 16px;
    padding: 20px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  /* Text input */
  .text-input-wrap {
    display: flex; gap: 12px; align-items: center;
  }
  .text-input {
    flex: 1;
    border: none; outline: none;
    font-family: 'Jost', sans-serif;
    font-size: 15px; font-weight: 300;
    color: var(--charcoal);
    background: transparent;
    padding: 6px 0;
  }
  .text-input::placeholder { color: var(--gold-light); }
  .send-btn {
    background: var(--gold);
    border: none; cursor: pointer;
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--gold-dark); transform: scale(1.05); }
  .send-btn svg { width: 18px; height: 18px; fill: white; }

  /* Options grid */
  .options-grid {
    display: flex; flex-direction: column; gap: 10px;
  }
  .option-btn {
    width: 100%;
    background: var(--cream);
    border: 1px solid var(--gold-light);
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    font-size: 14px; font-weight: 300;
    color: var(--charcoal);
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    display: flex; align-items: center; gap: 12px;
  }
  .option-btn:hover {
    background: var(--gold-light);
    border-color: var(--gold);
    transform: translateX(4px);
  }
  .option-btn.selected {
    background: var(--gold);
    border-color: var(--gold-dark);
    color: var(--white);
  }
  .option-emoji { font-size: 20px; flex-shrink: 0; }
  .option-label { flex: 1; }
  .option-sub { font-size: 11px; color: var(--warm-gray); margin-top: 2px; }
  .option-btn.selected .option-sub { color: rgba(255,255,255,0.7); }

  /* Options 2-col */
  .options-grid-2col {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .options-grid-2col .option-btn { flex-direction: column; text-align: center; gap: 6px; }
  .options-grid-2col .option-emoji { font-size: 28px; }

  /* Confirm btn */
  .confirm-btn {
    width: 100%; margin-top: 14px;
    background: var(--charcoal); color: var(--white);
    border: none; border-radius: 10px;
    padding: 14px;
    font-family: 'Jost', sans-serif;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    display: none;
  }
  .confirm-btn:hover { background: var(--gold-dark); }
  .confirm-btn.show { display: block; }

  /* Yes/No row */
  .yesno-row { display: flex; gap: 10px; }
  .yesno-row .option-btn { flex: 1; justify-content: center; }

  /* ── RESULT CARD ── */
  .result-card {
    background: var(--white);
    border: 1px solid var(--gold-light);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  }
  .result-header {
    background: linear-gradient(135deg, var(--charcoal) 0%, #3d3530 100%);
    padding: 32px 28px;
    text-align: center;
  }
  .result-icon { font-size: 48px; margin-bottom: 12px; }
  .result-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 400;
    color: var(--white); margin-bottom: 8px;
  }
  .result-header p {
    font-size: 13px; color: rgba(255,255,255,0.65);
    font-weight: 300; line-height: 1.6;
  }
  .result-body { padding: 28px; }
  .result-section-title {
    font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 16px; margin-top: 24px;
  }
  .result-section-title:first-child { margin-top: 0; }
  .result-diagnosis {
    background: var(--cream);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 8px;
    font-size: 13px; line-height: 1.7;
    color: var(--charcoal); font-weight: 300;
  }
  .product-reco-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 12px;
  }
  .product-reco-card {
    background: var(--cream);
    border: 1px solid var(--gold-light);
    border-radius: 10px;
    padding: 16px;
    position: relative;
  }
  .reco-step {
    font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 4px;
  }
  .reco-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; font-weight: 400;
    margin-bottom: 4px; line-height: 1.2;
  }
  .reco-why {
    font-size: 11px; color: var(--warm-gray);
    line-height: 1.5;
  }
  .reco-price {
    font-size: 13px; font-weight: 500;
    color: var(--gold-dark); margin-top: 8px;
  }
  .kit-reco-card {
    background: var(--charcoal);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .kit-reco-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; color: var(--white); margin-bottom: 4px;
  }
  .kit-reco-desc { font-size: 11px; color: rgba(255,255,255,0.5); }
  .kit-reco-price { text-align: right; }
  .kit-price-val { font-size: 22px; color: var(--gold); font-weight: 300; }
  .kit-price-eco { font-size: 10px; color: rgba(255,255,255,0.4); }
  .result-alert {
    background: #FFF8F0;
    border: 1px solid #F5DEB3;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px; color: #8B6914;
    line-height: 1.6; margin-top: 12px;
  }
  .result-ctas {
    display: flex; gap: 12px; margin-top: 24px;
  }
  .cta-primary {
    flex: 1;
    background: var(--gold); color: var(--white);
    border: none; border-radius: 10px;
    padding: 14px; font-family: 'Jost', sans-serif;
    font-size: 12px; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
    transition: background 0.2s;
  }
  .cta-primary:hover { background: var(--gold-dark); }
  .cta-secondary {
    flex: 1;
    background: transparent; color: var(--charcoal);
    border: 1px solid var(--gold-light); border-radius: 10px;
    padding: 14px; font-family: 'Jost', sans-serif;
    font-size: 12px; letter-spacing: 1.5px;
    text-transform: uppercase; cursor: pointer;
    transition: background 0.2s;
  }
  .cta-secondary:hover { background: var(--cream); }

  /* Retake */
  .retake-link {
    text-align: center; margin-top: 16px;
    font-size: 11px; color: var(--warm-gray);
    letter-spacing: 1px; cursor: pointer;
  }
  .retake-link:hover { color: var(--gold-dark); }

  @media (max-width: 600px) {
    .quiz-header { padding: 14px 20px; }
    .quiz-main { padding: 20px 12px; }
    .options-grid-2col { grid-template-columns: 1fr; }
    .product-reco-grid { grid-template-columns: 1fr; }
    .result-ctas { flex-direction: column; }
    .kit-reco-card { flex-direction: column; gap: 12px; }
    .kit-reco-price { text-align: left; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="quiz-header">
  <a href="patmo-site.html" class="quiz-header-logo">Patmo <span>✦</span></a>
  <a href="patmo-site.html" class="quiz-back">← Voltar ao site</a>
</div>

<!-- PROGRESS -->
<div class="progress-bar-wrap">
  <div class="progress-bar" id="progressBar"></div>
</div>
<p class="progress-label" id="progressLabel">Sua Jornada Patmo</p>

<!-- MAIN -->
<div class="quiz-main">
  <div class="chat-container">

    <!-- Messages feed -->
    <div class="messages" id="messages"></div>

    <!-- Typing indicator -->
    <div class="typing" id="typing">
      <div class="avatar">P</div>
      <div class="typing-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area" id="inputArea" style="display:none;"></div>

  </div>
</div>

<script>
// ── CATALOG DATA ──
const catalog = {
  limpeza: {
    antioleosidade: { name: 'Mousse de Limpeza Facial (Complexo Antioleosidade)', price: 'R$ 101,86', step: 'Limpeza' },
    micellar_c: { name: 'Mousse Micellar C (Vitamina C + Centella)', price: 'R$ 111,15', step: 'Limpeza' },
    hidratante: { name: 'Sabonete Facial Hidratante', price: 'R$ 101,86', step: 'Limpeza' },
    agua_micelar: { name: 'Cleansing Water (Água Micelar)', price: 'R$ 80,19', step: 'Limpeza' },
  },
  tonico: {
    essence: { name: 'Essence Toner (Lactobacillus, Exossomos)', price: 'R$ 86,38', step: 'Tônico' },
    agua_termal: { name: 'Água Termal Hidratante', price: 'R$ 80,19', step: 'Tônico/Hidratação' },
  },
  serum: {
    salicilico: { name: 'Sérum Ácido Salicílico 2%', price: 'R$ 123,53', step: 'Sérum' },
    glicolic: { name: 'Sérum Ácido Glicólico 10%', price: 'R$ 123,53', step: 'Sérum' },
    niacinamida: { name: 'Sérum Niacinamida 10 + ZN', price: 'R$ 123,53', step: 'Sérum' },
    pore_min: { name: 'Sérum Pore Minimizing', price: 'R$ 154,49', step: 'Sérum' },
    skinglass: { name: 'Sérum SkinGlass (Clareador/Melasma)', price: 'R$ 145,20', step: 'Sérum' },
    antioxidante: { name: 'Sérum Antioxidante', price: 'R$ 126,63', step: 'Sérum' },
    hyaluronic: { name: 'Sérum Hyaluronic Booster C+E', price: 'R$ 154,49', step: 'Sérum' },
    peptideos: { name: 'Sérum Peptídeos', price: 'R$ 169,97', step: 'Sérum' },
    time_skin: { name: 'Sérum Time Skin EXO (Anti-rugas Intensivo)', price: 'R$ 185,45', step: 'Sérum' },
    banco_col: { name: 'Sérum Banco de Colágeno', price: 'R$ 126,63', step: 'Sérum' },
    nano_btx: { name: 'Sérum Nano BTX', price: 'R$ 126,63', step: 'Sérum' },
    mixbean: { name: 'Sérum Mixbean (Phytofirm Biotic + Exossomos)', price: 'R$ 114,24', step: 'Sérum' },
    anti_zombie: { name: 'Sérum Anti Zombie Cells (PDRN + EXO)', price: 'R$ 340,25', step: 'Sérum Premium' },
  },
  creme: {
    vitamina_c: { name: 'Double Vitamina C 10%', price: 'R$ 123,53', step: 'Creme Diurno' },
    night_retinol: { name: 'Night Cream Retinol Melatonin', price: 'R$ 123,53', step: 'Creme Noturno' },
    dermopausa: { name: 'Dermopausa Cream PDRN', price: 'R$ 154,49', step: 'Creme Especial' },
    gel_calmante: { name: 'Gel Creme Calmante (Pele Sensível)', price: 'R$ 80,19', step: 'Hidratante' },
  },
  protecao: {
    fps75: { name: 'Bastão FPS 75 | UVA 25', price: 'R$ 126,63', step: 'Proteção Solar' },
    fps60_cc: { name: 'Camaleão Cream FPS 60', price: 'R$ 185,45', step: 'Proteção Solar com Cor' },
    fps60: { name: 'Creme/Hidratante Facial FPS 60 (Sem cor)', price: 'R$ 169,97', step: 'Proteção Solar' },
    kprimmer: { name: 'K-Primmer Apple Glow', price: 'R$ 247,37', step: 'Primer/Proteção' },
    stick_labial: { name: 'Stick Labial FPS 75', price: 'R$ 58,51', step: 'Proteção Labial' },
  },
  olhos: {
    eye_repair: { name: 'Eye Repair Exossomos (Diurno)', price: 'R$ 219,50', step: 'Área dos Olhos' },
    eye_mask: { name: 'Eye Sleeping Mask com PDRN (Noturno)', price: 'R$ 111,15', step: 'Área dos Olhos' },
  },
  kits: {
    acne: { name: 'Kit Tratamento Acne', price: 'R$ 340,53', desc: 'Kit completo para controle de acne' },
    manchas: { name: 'Kit Tratamento Manchas', price: 'R$ 433,41', desc: 'Kit completo para clareamento' },
    pos_laser: { name: 'Kit Pós Laser Lavieen', price: 'R$ 247,65', desc: 'Recuperação e cuidado pós procedimento' },
    calmante: { name: 'Kit Calmante Pós Procedimentos', price: 'R$ 247,65', desc: 'Ideal para pele sensível e reativa' },
    viagem: { name: 'Kit Miniatura Viagem', price: 'R$ 278,33', desc: 'Rotina completa em formato travel' },
    basico: { name: 'Kit Inicial Básico Skincare', price: 'R$ 464,09', desc: 'Para começar sua rotina do zero' },
  },
  labial: {
    gloss_led: { name: 'Gloss Labial Hyaluronic (Tampa Dourada + LED)', price: 'R$ 104,95', step: 'Gloss' },
    gloss_kiko: { name: 'Gloss Labial Hyaluronic (Tampa Prata)', price: 'R$ 89,47', step: 'Gloss' },
    lipscrub: { name: 'Lipscrub Esfoliante Labial', price: 'R$ 89,78', step: 'Esfoliação Labial' },
    hydralips: { name: 'Hydralips Máscara Hidratante Labial', price: 'R$ 123,53', step: 'Máscara Labial' },
    hydragloss: { name: 'Hydragloss Sérum Labial', price: 'R$ 120,74', step: 'Sérum Labial' },
    lip_oil: { name: 'Lip Oil Repair (Peptídeos e Óleo de Framboesa)', price: 'R$ 61,61', step: 'Lip Oil' },
  }
};

// ── RECOMMENDATION ENGINE ──
function buildRecommendation(data) {
  const { queixa, pele, fototipo, gestante, alergia_sali, alergia_vitc, nome } = data;
  let routine = [];
  let kitSugerido = null;
  let diagnostico = '';
  let alerta = '';

  // Gestante alert
  if (gestante) {
    alerta = '⚠️ Como você está grávida ou amamentando, evitamos recomendar Retinol e Ácido Glicólico em altas concentrações. Sua rotina foi montada com ativos seguros para esse período especial.';
  }

  if (queixa === 'acne') {
    diagnostico = `${nome}, sua pele precisa de **controle de oleosidade** e tratamento ativo da acne. A combinação ideal une limpeza profunda, regulação sebácea e proteção solar que não entupa os poros.`;
    routine = [
      catalog.limpeza.antioleosidade,
      catalog.tonico.essence,
      alergia_sali ? catalog.serum.niacinamida : catalog.serum.salicilico,
      catalog.serum.pore_min,
      fototipo === 'escura' ? catalog.protecao.fps60 : catalog.protecao.fps60_cc,
      catalog.protecao.stick_labial,
    ];
    kitSugerido = catalog.kits.acne;

  } else if (queixa === 'manchas') {
    diagnostico = `${nome}, vamos trabalhar em **luminosidade e despigmentação**. Sua rotina precisa de ativos clareadores potentes de manhã, renovação celular à noite e proteção solar rigorosa (o mais importante para manchas!).`;
    routine = [
      alergia_vitc ? catalog.limpeza.micellar_c : catalog.limpeza.micellar_c,
      catalog.tonico.essence,
      catalog.serum.skinglass,
      alergia_vitc ? catalog.serum.niacinamida : catalog.creme.vitamina_c,
      gestante ? catalog.serum.hyaluronic : catalog.serum.glicolic,
      catalog.protecao.fps60_cc,
    ];
    kitSugerido = catalog.kits.manchas;

  } else if (queixa === 'rugas') {
    diagnostico = `${nome}, o foco aqui é **estímulo de colágeno e firmeza**. Usamos peptídeos bioativos, exossomos e retinol (com cuidado se for o seu caso) para suavizar linhas e devolver a densidade da pele.`;
    routine = [
      catalog.limpeza.micellar_c,
      catalog.tonico.essence,
      catalog.serum.peptideos,
      catalog.serum.banco_col,
      gestante ? catalog.serum.hyaluronic : catalog.creme.night_retinol,
      catalog.olhos.eye_repair,
      catalog.protecao.fps60,
    ];
    if (!gestante) routine.push(catalog.serum.time_skin);

  } else if (queixa === 'hidratacao') {
    diagnostico = `${nome}, sua pele precisa de **reforço da barreira cutânea e hidratação profunda**. Vamos reconstruir o manto hidrolipídico e trazer aquele efeito Glass Skin que toda pele pede!`;
    routine = [
      catalog.limpeza.hidratante,
      catalog.tonico.agua_termal,
      catalog.serum.hyaluronic,
      catalog.serum.mixbean,
      catalog.creme.vitamina_c,
      catalog.protecao.fps60,
    ];

  } else if (queixa === 'sensibilidade') {
    diagnostico = `${nome}, o objetivo é **acalmar, proteger e fortalecer** sua pele. Precisamos de ativos antiinflamatórios, barreira reforçada e zero agressão — menos é mais!`;
    routine = [
      catalog.limpeza.hidratante,
      catalog.tonico.agua_termal,
      catalog.serum.mixbean,
      catalog.creme.gel_calmante,
      catalog.serum.hyaluronic,
      catalog.protecao.fps60,
    ];
    kitSugerido = catalog.kits.calmante;
  }

  // Add eye care for mature skin concerns
  if (queixa === 'rugas' || (queixa === 'manchas' && fototipo !== 'clara')) {
    if (!routine.find(r => r && r.name && r.name.includes('Eye'))) {
      routine.push(catalog.olhos.eye_mask);
    }
  }

  // Alergia notes
  if (alergia_sali && queixa === 'acne') {
    alerta += (alerta ? ' ' : '') + '⚠️ Substituímos o Ácido Salicílico pela Niacinamida 10%, igualmente eficaz para oleosidade sem risco para você.';
  }

  return { routine: routine.filter(Boolean), kitSugerido, diagnostico, alerta };
}

// ── QUIZ STATE ──
const state = {
  step: 0,
  data: {},
  totalSteps: 10
};

const messagesEl = document.getElementById('messages');
const typingEl = document.getElementById('typing');
const inputAreaEl = document.getElementById('inputArea');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');

function updateProgress(step) {
  const pct = Math.min((step / state.totalSteps) * 100, 100);
  progressBar.style.width = pct + '%';
  const labels = ['', 'Bem-vinda', 'Seu Nome', 'Contato', 'Idade', 'Sua Pele', 'Tom de Pele', 'Tipo de Pele', 'Saúde', 'Análise', 'Resultado'];
  progressLabel.textContent = labels[step] ? `${step} de ${state.totalSteps} · ${labels[step]}` : 'Concluído';
}

function addMessage(type, html, delay = 0) {
  return new Promise(resolve => {
    setTimeout(() => {
      const msg = document.createElement('div');
      msg.className = `msg msg-${type}`;
      if (type === 'dra') {
        msg.innerHTML = `
          <div class="avatar">P</div>
          <div class="bubble">
            <div class="bubble-name">Dra. Patrícia Moura</div>
            <div class="bubble-text">${html}</div>
          </div>`;
      } else {
        msg.innerHTML = `
          <div class="bubble"><div class="bubble-text">${html}</div></div>
          <div class="avatar">👤</div>`;
      }
      messagesEl.appendChild(msg);
      setTimeout(() => {
        msg.classList.add('show');
        msg.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 50);
      resolve();
    }, delay);
  });
}

function showTyping(ms = 1400) {
  return new Promise(resolve => {
    typingEl.classList.add('show');
    typingEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
    setTimeout(() => {
      typingEl.classList.remove('show');
      resolve();
    }, ms);
  });
}

function clearInput() {
  inputAreaEl.innerHTML = '';
  inputAreaEl.style.display = 'none';
}

function showTextInput(placeholder, onSubmit) {
  inputAreaEl.style.display = 'block';
  inputAreaEl.innerHTML = `
    <div class="text-input-wrap">
      <input class="text-input" type="text" placeholder="${placeholder}" id="txtInput" autocomplete="off">
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>`;
  const inp = document.getElementById('txtInput');
  const btn = document.getElementById('sendBtn');
  inp.focus();
  const submit = () => {
    const val = inp.value.trim();
    if (!val) return;
    clearInput();
    onSubmit(val);
  };
  btn.onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

function showEmailInput(onSubmit) {
  inputAreaEl.style.display = 'block';
  inputAreaEl.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="text-input-wrap">
        <input class="text-input" type="email" placeholder="Seu melhor e-mail" id="emailInput" autocomplete="email">
      </div>
      <div class="text-input-wrap">
        <input class="text-input" type="tel" placeholder="WhatsApp com DDD" id="whatsInput" autocomplete="tel">
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>`;
  const emailInp = document.getElementById('emailInput');
  const whatsInp = document.getElementById('whatsInput');
  const btn = document.getElementById('sendBtn');
  emailInp.focus();
  btn.onclick = () => {
    const email = emailInp.value.trim();
    const whats = whatsInp.value.trim();
    if (!email || !whats) { emailInp.style.borderBottom = '1px solid red'; return; }
    clearInput();
    onSubmit(email, whats);
  };
}

function showDateInput(onSubmit) {
  inputAreaEl.style.display = 'block';
  inputAreaEl.innerHTML = `
    <div class="text-input-wrap">
      <input class="text-input" type="date" id="dateInput">
      <button class="send-btn" id="sendBtn">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>`;
  const inp = document.getElementById('dateInput');
  const btn = document.getElementById('sendBtn');
  inp.focus();
  btn.onclick = () => {
    const val = inp.value;
    if (!val) return;
    const age = new Date().getFullYear() - new Date(val).getFullYear();
    clearInput();
    onSubmit(val, age);
  };
}

function showOptions(options, onSelect, cols = 1) {
  inputAreaEl.style.display = 'block';
  const gridClass = cols === 2 ? 'options-grid-2col' : 'options-grid';
  const btns = options.map(opt => `
    <button class="option-btn" data-val="${opt.val}">
      ${opt.emoji ? `<span class="option-emoji">${opt.emoji}</span>` : ''}
      <div class="option-label">
        <div>${opt.label}</div>
        ${opt.sub ? `<div class="option-sub">${opt.sub}</div>` : ''}
      </div>
    </button>`).join('');
  inputAreaEl.innerHTML = `<div class="${gridClass}">${btns}</div>`;
  inputAreaEl.querySelectorAll('.option-btn').forEach(btn => {
    btn.onclick = () => {
      const val = btn.dataset.val;
      const label = btn.querySelector('.option-label div').textContent;
      const emoji = btn.querySelector('.option-emoji') ? btn.querySelector('.option-emoji').textContent : '';
      clearInput();
      onSelect(val, emoji + ' ' + label);
    };
  });
}

function showYesNo(onSelect) {
  showOptions([
    { val: 'sim', label: 'Sim', emoji: '✅' },
    { val: 'nao', label: 'Não', emoji: '❌' },
  ], onSelect, 2);
}

// ── QUIZ FLOW ──
async function runQuiz() {
  // Step 0: Welcome
  updateProgress(1);
  await showTyping(1600);
  await addMessage('dra', 'Olá! Que prazer ter você aqui! 🌸 Eu sou a <strong>Dra. Patrícia Moura</strong>, fisioterapeuta dermatofuncional com 20 anos de experiência.');
  await showTyping(1200);
  await addMessage('dra', 'Para que eu possa entender as necessidades da sua pele e indicar o melhor ritual de autocuidado da Patmo, preciso te conhecer um pouquinho melhor. Vamos começar?');
  showOptions([{ val: 'sim', label: 'Sim, vamos lá! 😊', emoji: '✨' }], async () => {
    await addMessage('user', '✨ Sim, vamos lá! 😊');
    stepNome();
  });
}

async function stepNome() {
  updateProgress(2);
  await showTyping(1000);
  await addMessage('dra', 'Como você gostaria de ser chamada?');
  showTextInput('Seu nome...', async (val) => {
    state.data.nome = val;
    await addMessage('user', val);
    stepContato();
  });
}

async function stepContato() {
  updateProgress(3);
  await showTyping(1000);
  await addMessage('dra', `Que nome lindo, <strong>${state.data.nome}</strong>! 💛 Agora me passa seu e-mail e WhatsApp — prometo que só envio dicas de cuidado e novidades da Patmo!`);
  showEmailInput(async (email, whats) => {
    state.data.email = email;
    state.data.whats = whats;
    await addMessage('user', `📧 ${email} · 📱 ${whats}`);
    stepIdade();
  });
}

async function stepIdade() {
  updateProgress(4);
  await showTyping(1000);
  await addMessage('dra', 'Qual sua data de nascimento? A pele tem necessidades diferentes em cada fase da vida, e isso muda completamente a rotina ideal! 🌿');
  showDateInput(async (val, age) => {
    state.data.idade = age;
    const formatted = new Date(val + 'T12:00:00').toLocaleDateString('pt-BR');
    await addMessage('user', `📅 ${formatted} (${age} anos)`);
    stepQueixa();
  });
}

async function stepQueixa() {
  updateProgress(5);
  await showTyping(1200);
  await addMessage('dra', `${state.data.nome}, agora me conta: se você pudesse focar em apenas <strong>uma coisa</strong> para melhorar na sua pele hoje, o que seria?`);
  showOptions([
    { val: 'acne', emoji: '💧', label: 'Controlar a oleosidade e acne', sub: 'Poros abertos, brilho, cravos' },
    { val: 'manchas', emoji: '🌟', label: 'Clarear manchas ou uniformizar o tom', sub: 'Melasma, manchas solares, olheiras' },
    { val: 'rugas', emoji: '⏳', label: 'Suavizar linhas de expressão e rugas', sub: 'Firmeza, densidade, elasticidade' },
    { val: 'hidratacao', emoji: '🌊', label: 'Hidratar e tirar o aspecto "pele opaca"', sub: 'Ressecamento, falta de viço' },
    { val: 'sensibilidade', emoji: '🌸', label: 'Diminuir a sensibilidade e vermelhidão', sub: 'Pele reativa, rosácea, irritação' },
  ], async (val, label) => {
    state.data.queixa = val;
    await addMessage('user', label.trim());
    stepFototipo();
  });
}

async function stepFototipo() {
  updateProgress(6);
  await showTyping(1200);
  await addMessage('dra', 'Perfeito! Agora preciso entender seu <strong>fototipo</strong> — como sua pele reage ao sol? Isso me ajuda a calibrar os ativos corretamente. ☀️');
  showOptions([
    { val: 'clara', emoji: '🤍', label: 'Pele Clara', sub: 'Sempre queima, raramente ou nunca bronzeia' },
    { val: 'media', emoji: '🤎', label: 'Pele Morena Clara/Média', sub: 'Queima às vezes, bronzeia gradualmente' },
    { val: 'escura', emoji: '🖤', label: 'Pele Morena Escura/Negra', sub: 'Raramente queima, bronzeia com facilidade' },
  ], async (val, label) => {
    state.data.fototipo = val;
    await addMessage('user', label.trim());
    stepTipoPele();
  });
}

async function stepTipoPele() {
  updateProgress(7);
  await showTyping(1200);
  await addMessage('dra', 'E como você sente seu rosto ao <strong>final do dia</strong>? 🌙');
  showOptions([
    { val: 'oleosa', emoji: '💧', label: 'Oleosa', sub: 'Brilho intenso em todo o rosto e poros abertos' },
    { val: 'mista', emoji: '⚖️', label: 'Mista', sub: 'Brilho só na testa, nariz e queixo (zona T)' },
    { val: 'seca', emoji: '🏜️', label: 'Seca', sub: 'Repuxamento, sem brilho, linhas visíveis' },
    { val: 'normal', emoji: '✨', label: 'Normal', sub: 'Equilibrada, nem seca nem oleosa' },
  ], async (val, label) => {
    state.data.pele = val;
    await addMessage('user', label.trim());
    stepAlergias();
  });
}

async function stepAlergias() {
  updateProgress(8);
  await showTyping(1200);
  await addMessage('dra', 'Agora umas perguntas de segurança — super importantes para eu não recomendar nada que te faça mal! 🛡️ Você tem alergia ao <strong>Ácido Salicílico</strong>?');
  showYesNo(async (val, label) => {
    state.data.alergia_sali = val === 'sim';
    await addMessage('user', label.trim());
    stepAlergia2();
  });
}

async function stepAlergia2() {
  await showTyping(800);
  await addMessage('dra', 'E à <strong>Vitamina C</strong> ou outros ácidos?');
  showYesNo(async (val, label) => {
    state.data.alergia_vitc = val === 'sim';
    await addMessage('user', label.trim());
    stepGestante();
  });
}

async function stepGestante() {
  updateProgress(9);
  await showTyping(800);
  await addMessage('dra', 'Você está <strong>grávida ou amamentando</strong>? Alguns ativos como Retinol e Glicólico precisam de atenção extra nessa fase tão especial. 🌷');
  showYesNo(async (val, label) => {
    state.data.gestante = val === 'sim';
    await addMessage('user', label.trim());
    stepAnalise();
  });
}

async function stepAnalise() {
  updateProgress(10);
  clearInput();
  await showTyping(800);
  await addMessage('dra', `Perfeita! Obrigada por compartilhar, <strong>${state.data.nome}</strong>. Agora vou analisar tudo e montar sua rotina personalizada... 🔬✨`);
  await showTyping(2800);
  await addMessage('dra', 'Pronto! Analisei seu perfil completo. Aqui está minha recomendação exclusiva para você 💛');
  showResult();
}

function showResult() {
  updateProgress(11);
  const rec = buildRecommendation(state.data);
  const { routine, kitSugerido, diagnostico, alerta } = rec;

  const diagFormatted = diagnostico.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

  const routineCards = routine.map((prod, i) => `
    <div class="product-reco-card">
      <div class="reco-step">Passo ${i + 1} · ${prod.step}</div>
      <div class="reco-name">${prod.name}</div>
      <div class="reco-price">${prod.price}</div>
    </div>`).join('');

  const kitHTML = kitSugerido ? `
    <div class="result-section-title">Kit Completo Sugerido</div>
    <div class="kit-reco-card">
      <div>
        <div class="kit-reco-name">${kitSugerido.name}</div>
        <div class="kit-reco-desc">${kitSugerido.desc}</div>
      </div>
      <div class="kit-reco-price">
        <div class="kit-price-val">${kitSugerido.price}</div>
        <div class="kit-price-eco">kit completo</div>
      </div>
    </div>` : '';

  const alertHTML = alerta ? `<div class="result-alert">${alerta}</div>` : '';

  const profileEmojis = {
    acne: '💧', manchas: '🌟', rugas: '⏳', hidratacao: '🌊', sensibilidade: '🌸'
  };
  const profileTitles = {
    acne: 'Rotina Anti-Acne & Oleosidade',
    manchas: 'Rotina Clareadora & Antimanchas',
    rugas: 'Rotina Antienvelhecimento Premium',
    hidratacao: 'Rotina Hidratação & Glass Skin',
    sensibilidade: 'Rotina Calmante & Protetora',
  };

  const resultHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-icon">${profileEmojis[state.data.queixa]}</div>
        <h2>${profileTitles[state.data.queixa]}</h2>
        <p>Montada exclusivamente para ${state.data.nome} · ${state.data.idade} anos</p>
      </div>
      <div class="result-body">
        <div class="result-section-title">Diagnóstico da Dra. Patrícia</div>
        <div class="result-diagnosis">${diagFormatted}</div>
        ${alertHTML}
        <div class="result-section-title">Sua Rotina Personalizada</div>
        <div class="product-reco-grid">${routineCards}</div>
        ${kitHTML}
        <div class="result-ctas">
          <button class="cta-primary" onclick="openWhatsapp()">💬 Falar com a Dra. Patrícia</button>
          <button class="cta-secondary" onclick="window.location='patmo-site.html'">Ver Todos os Produtos</button>
        </div>
        <p class="retake-link" onclick="resetQuiz()">↩ Refazer a avaliação</p>
      </div>
    </div>`;

  const resultMsg = document.createElement('div');
  resultMsg.className = 'msg msg-dra';
  resultMsg.innerHTML = `<div class="avatar">P</div><div style="flex:1">${resultHTML}</div>`;
  messagesEl.appendChild(resultMsg);
  setTimeout(() => {
    resultMsg.classList.add('show');
    resultMsg.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function openWhatsapp() {
  const msg = encodeURIComponent(`Olá Dra. Patrícia! Acabei de fazer a pré-avaliação da Patmo. Meu nome é ${state.data.nome} e gostaria de saber mais sobre a rotina indicada para mim! 💛`);
  window.open(`https://wa.me/5511911248845?text=${msg}`, '_blank');
}

function resetQuiz() {
  state.step = 0;
  state.data = {};
  messagesEl.innerHTML = '';
  clearInput();
  runQuiz();
}

// ── START ──
runQuiz();
</script>
